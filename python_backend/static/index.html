<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo List</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
    li { display: flex; align-items: center; gap: 8px; margin: 8px 0; list-style: none; }
    .done { text-decoration: line-through; color: gray; }
    input[type="text"] { flex: 1; padding: 6px; }
    ul { padding: 0; }
  </style>
</head>
<body>
  <h1>Todo List</h1>
  <div style="display: flex; gap: 8px;">
    <input type="text" id="titleInput" placeholder="New todo">
    <button onclick="addTodo()">Add</button>
  </div>
  <ul id="todoList"></ul>

  <script>
    const BASE_URL = "http://127.0.0.1:8000";

    async function loadTodos() {
      const res = await fetch(`${BASE_URL}/todos`);
      const todos = await res.json();
      const list = document.getElementById("todoList");
      list.innerHTML = "";
      todos.forEach(todo => {
        const li = document.createElement("li");
        li.innerHTML = `
          <input type="checkbox" ${todo.completed ? "checked" : ""} onchange="toggleTodo(${todo.id}, ${todo.completed})">
          <span class="${todo.completed ? "done" : ""}">${todo.title}</span>
          <button onclick="deleteTodo(${todo.id})">Delete</button>
        `;
        list.appendChild(li);
      });
    }

    async function addTodo() {
      const input = document.getElementById("titleInput");
      const title = input.value.trim();
      if (!title) return;
      await fetch(`${BASE_URL}/todos`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, completed: false })
      });
      input.value = "";
      loadTodos();
    }

    async function toggleTodo(id, completed) {
      await fetch(`${BASE_URL}/todos/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ completed: !completed })
      });
      loadTodos();
    }

    async function deleteTodo(id) {
      await fetch(`${BASE_URL}/todos/${id}`, { method: "DELETE" });
      loadTodos();
    }

    loadTodos();
  </script>
</body>
</html>
